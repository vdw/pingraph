default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Alerts get their own worker so they never wait behind probes during a mass outage.
    - queues: notifications
      threads: 2
      processes: 1
      polling_interval: 0.1
    # Probes spend most of their time waiting on the network, so more threads help.
    # Each worker process needs a DB connection per thread (see config/database.yml).
    - queues: "*"
      threads: <%= ENV.fetch("JOB_THREADS", 5) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
